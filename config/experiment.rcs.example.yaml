schema_version: "1.0"
experiment_id: "toy_rcs_protein_forecast"
dataset: "dataset.rcs.example.yaml"
seed: 20260901
task:
  kind: "group_time_forecast"
  target_modality: "protein"
  input_modalities: ["rna", "protein"]
  target_time_min: 4.0
  primary_metric: "protein_macro_pcc"
split:
  group_columns: ["batch"]
  fractions:
    train: 0.34
    val: 0.33
    test: 0.33
  block_experiment_batch: true
  also_block: ["experimental_unit_id", "subject_id", "biospecimen_id"]
  assignment:
    expA: "train"
    expB: "val"
    expC: "test"
models:
  - name: "last_value"
    params: {}
  - name: "ridge"
    params:
      alpha: 1.0
  - name: "time_spline"
    params:
      spline_df: 3
      alpha: 1.0
preprocessing:
  scale: true
  impute: true
evaluation:
  bootstrap_replicates: 50
  unlock_test: false
